<script src="https://unpkg.com/prettier@2.3.2/standalone.js"></script>
<script src="https://unpkg.com/prettier@2.3.2/parser-html.js"></script>
<!-- <script src="https://unpkg.com/prettier@2.3.2/parser-babylon.js"></script> -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/prism.min.js"></script>
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/themes/prism.min.css"
/>
<!-- <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> -->
<script src="%(WEBPATH)sjquery-3.5.1.min.js"></script> <!-- load local -->
<script src="%(WEBPATH)slistReorder.js"></script> <!-- Load the external reordering script -->
<script src="%(WEBPATH)sshortcuts.js"></script>
<script src="%(WEBPATH)sclozes.js"></script>
<script src="%(WEBPATH)sformatter.js"></script>
<script src="%(WEBPATH)ssourceCode.js"></script>
<script src="%(WEBPATH)stables.js"></script>
<script src="%(WEBPATH)stext-patterns.js"></script>
<script src="%(WEBPATH)selement-properties.js"></script>
<script src="%(WEBPATH)sdom-utilities.js"></script>


<script>

    var myfontsize = "%(FONTSIZE)s";
    // Define a global flag for save state
    let saving = false;

    tinymce.init({
        skin: "%(SKIN)s",
        theme: "%(THEME)s",
        selector: '.tinymce6_wysiwyg',
        auto_focus: 'tinymce6_wysiwyg_unique',
        document_base_url: '../../../../../../',
        body_class: 'bodyclass',
        content_css: [%(CONTENTCSS)s],
        formats: {
            bold: { inline: 'b' },
            italic: { inline: 'i' },
            underline: { inline: 'u' }
        },
        force_br_newlines: false,
        convert_newlines_to_brs: false,
        forced_root_block: 'div',
        extended_valid_elements: 'u,b,i',
        autoresize: false,
        table_use_colgroups: false,
        //     table_default_styles: {
        //     width: '50vw'
        //   },
        //   table_sizing_mode: 'fixed',

        invalid_styles: {
            '*': 'width',
            '*': 'text-align'
        },

        plugins: [
            "advlist", "anchor", "accordion", "autolink", "autosave", "charmap", "code", "codesample", "directionality",
            "emoticons", "fullscreen", "help", "insertdatetime", "link", "lists", "media",
            "nonbreaking", "searchreplace", "table", "visualblocks", "visualchars", "wordcount", "tablesEnhanced"
        ],        autosave_ask_before_unload: true,
        autosave_interval: "30s",
        autosave_restore_when_empty: false,        text_patterns: text_patterns,
        toolbar1: '%(TOOLBAR1)s | fixDomHierarchyButton unwrapParent moveItemDown',
        toolbar2: '%(TOOLBAR2)s | ClozesMenu',
        statusbar: false,
        promotion: false,
        menubar: 'edit view insert format tools table dom help media image',
        removed_menuitems: 'file print',
        menu: {
            format: {
                title: 'Format',
                items: 'bold italic underline strikethrough superscript subscript codeformat | styles blocks fontfamily fontsize align lineheight | forecolor backcolor | language | removeformat | removeTableStyles'
            },
            insert: {
                title: 'Insert',
                items: 'image link media addcomment pageembed template codesample inserttable | charmap emoticons hr | pagebreak nonbreaking anchor | insertdatetime | convertUlToTable'
            },
            dom: {
                title: 'DOM',
                items: 'editElementProperties sendCurrentNodeToConsole | addClassToElement | removeEmptyElements removeLineBreaks stripFontSize | unnestHeadings unwrapElement findRedundantDivs | deleteCurrentElementItem'
            }
        },
        contextmenu: "link inserttable | cell row column deletetable | list | image",
        table_toolbar: tableToolbarConfig,
        setup: function (editor) {
            console.log("[DEBUG] Setup function started");

            editor.on('init', function () {
                this.getDoc().body.style.fontSize = `${myfontsize.toString()}px`;
                this.getDoc().body.style.fontFamily = '%(FONTNAME)s';
            %(CUSTOMBGCOLOR)s
                editor.execCommand('mceFullScreen');
                editor.execCommand('mceVisualBlocks');
                applyClozeHighlighting(editor);
            });




            // Load external scripts
            sourceCodeMain(editor);
            registerFormatters(editor);
            clozesMain(editor);
            shortcutsMain(editor);
            console.log("[DEBUG] External scripts loaded");

            editor.on('dblclick', function (e) {
                const selection = editor.selection;
                const rng = selection.getRng();

                // Check if selection includes trailing whitespace
                const selectedText = selection.getContent({ format: 'text' });
                if (/\s$/.test(selectedText)) {
                    // Adjust the range to exclude trailing whitespace
                    rng.setEnd(rng.endContainer, rng.endOffset - 1);
                    selection.setRng(rng);
                }
            });

            // On editor close
            editor.on('getContent', function (e) {
                if (saving) {
                    console.log("Closing editor")
                    e.content = removeClozeHighlighting(e.content);
                    // Reset the flag to ensure processing occurs only once per save
                    saving = false;
                }
            });

            editor.addCommand('removeClozeHighlighting', function () {
                console.log("removeClozeHighlighting");
                let content = editor.getContent({ format: "html" });
                content = removeClozeHighlighting(content);
            });

            editor.addShortcut('ctrl+shift+r', 'Remove cloze highlighting', 'removeClozeHighlighting');

            // Register Clozes MenuButton
            editor.ui.registry.addMenuButton('ClozesMenu', {
                text: '{Clz}',
                fetch: (callback) => {
                    const items = [
                        {
                            type: 'menuitem',
                            text: 'Next Cloze (Ctrl+Shift+C)',
                            onAction: () => editor.execCommand('nextCloze')
                        },
                        {
                            type: 'menuitem',
                            text: 'Same Cloze (Ctrl+Alt+Shift+C)',
                            onAction: () => editor.execCommand('sameCloze')
                        },
                        {
                            type: 'menuitem',
                            text: 'Number Cloze (Ctrl+Shift+N)',
                            onAction: () => editor.execCommand('clozeNumber')
                        },
                        {
                            type: 'menuitem',
                            text: 'Remove Cloze Highlighting (Ctrl+Shift+R)',
                            onAction: () => editor.execCommand('removeClozeHighlighting')
                        }
                    ];
                    callback(items);
                }
            });
            console.log("[DEBUG] ClozesMenu registered");

            // Add reload editor menu item
            editor.ui.registry.addMenuItem('reloadeditor', {
                text: 'Reload Editor',
                icon: 'reload',
                onAction: function () {
                    if (editor.isDirty()) {
                        alert('You have unsaved changes. Please save or cancel first, then use the Reload button.');
                    } else {
                        alert('Please use the Reload button at the bottom of the editor.');
                    }
                }
            });
            console.log("[DEBUG] Reload editor menu item registered");

            addMenu(editor);
            console.log("[DEBUG] addMenu() called");

            // Register menu items for native menus (registered at end of setup)
            console.log("[DEBUG] Registering removeTableStyles menuItem");
            editor.ui.registry.addMenuItem("removeTableStyles", {
                text: "Clean table styles",
                icon: "code-sample",
                onAction: () => editor.execCommand("removeTableStyles")
            });
            console.log("[DEBUG] removeTableStyles menuItem registered");

            console.log("[DEBUG] Registering convertUlToTable menuItem");
            editor.ui.registry.addMenuItem("convertUlToTable", {
                text: "Ul→Table (nested list: headers from top-level, cells from nested items)",
                icon: "unordered-list",
                onAction: () => editor.execCommand("convertUlToTable")
            });
            console.log("[DEBUG] convertUlToTable menuItem registered");

            // Register DOM menu items
            console.log("[DEBUG] Registering DOM menu items");

            editor.ui.registry.addMenuItem("editElementProperties", {
                text: "Edit Element Properties",
                icon: "code-sample",
                onAction: () => {
                    const selectedNode = editor.selection.getNode();
                    editor.windowManager.open(createDialogConfig(selectedNode));
                }
            });

            editor.ui.registry.addMenuItem("addClassToElement", {
                text: "Add class to current element",
                icon: "code-sample",
                onAction: () => {
                    const node = editor.selection.getNode();
                    const currentClasses = node.className
                        ? `Current classes: ${node.className}`
                        : "No current classes";
                    const tagName = node.tagName.toLowerCase();
                    const className = prompt(
                        `Element: <${tagName}> \n${currentClasses}\n\nEnter the class name`
                    );
                    if (className) {
                        editor.dom.addClass(node, className);
                    }
                }
            });

            editor.ui.registry.addMenuItem("removeEmptyElements", {
                text: "Remove empty elements",
                icon: "remove",
                onAction: () => editor.setContent(
                    editor.getContent().replace(/<(\w+)(\s*[^>]*)>(\s|&nbsp;)*<\/\1>/g, "")
                )
            });

            editor.ui.registry.addMenuItem("removeLineBreaks", {
                text: "Remove line breaks from selection",
                onAction: () => {
                    const selectedContent = editor.selection.getContent({ format: "html" });
                    const strippedContent = selectedContent.replace(/font-size:\s*[^;]+;?/gi, "");
                    const container = editor.selection.getNode();
                    container.innerHTML = container.innerHTML.replace(selectedContent, strippedContent);
                }
            });

            editor.ui.registry.addMenuItem("stripFontSize", {
                text: "Strip font-size from selection",
                icon: "remove",
                onAction: () => {
                    const selectedContent = editor.selection.getContent({ format: "html" });
                    const strippedContent = selectedContent.replace(/font-size:\s*[^;]+;?/gi, "");
                    const container = editor.selection.getNode();
                    container.innerHTML = container.innerHTML.replace(selectedContent, strippedContent);
                }
            });

            editor.ui.registry.addMenuItem("unnestHeadings", {
                text: "Unnest headings",
                icon: "lock",
                onAction: () => unnestHeadings(editor)
            });

            editor.ui.registry.addMenuItem("unwrapElement", {
                text: "Unwrap element",
                icon: "lock",
                onAction: () => {
                    const node = editor.selection.getNode();
                    unwrapElement(editor, node);
                }
            });

            editor.ui.registry.addMenuItem("findRedundantDivs", {
                text: "Find redundant divs",
                icon: "lock",
                onAction: () => findRedundantDivs(editor)
            });

            editor.ui.registry.addMenuItem("deleteCurrentElementItem", {
                text: "Delete current element (closest div/p/tr)",
                icon: "remove",
                onAction: () => editor.execCommand("deleteCurrentElement")
            });

            editor.ui.registry.addMenuItem("sendCurrentNodeToConsole", {
                text: "Send Current Node to Console",
                icon: "help",
                onAction: () => editor.execCommand("sendCurrentNodeToConsole")
            });

            console.log("[DEBUG] DOM menu items registered");

            // Debug: Check what's in the registry
            console.log("[DEBUG] All registered menuItems:", Object.keys(editor.ui.registry.getAll().menuItems || {}));
            console.log("[DEBUG] Setup function complete");
        }
    });
</script>

<div
    class="tinymce6_wysiwyg"
    id="tinymce6_wysiwyg_unique"
>CONTENTCONTENT</div>

<script src="https://unpkg.com/prettier@2.3.2/standalone.js"></script>
<script src="https://unpkg.com/prettier@2.3.2/parser-html.js"></script>
<!-- <script src="https://unpkg.com/prettier@2.3.2/parser-babylon.js"></script> -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/prism.min.js"></script>
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/themes/prism.min.css"
/>
<!-- <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> -->
<script src="_addons/805891399/web/jquery-3.5.1.min.js"></script> <!-- load local -->
<script src="_addons/805891399/web/listReorder.js"></script> <!-- Load the external reordering script -->
<script src="_addons/805891399/web/shortcuts.js"></script>
<script src="_addons/805891399/web/clozes.js"></script>
<script src="_addons/805891399/web/formatter.js"></script>
<script src="_addons/805891399/web/sourceCode.js"></script>
<script src="_addons/805891399/web/tables.js"></script>
<script src="_addons/805891399/web/text-patterns.js"></script>
<script>


        tinymce.init({
    skin: "%(SKIN)s",
    theme: "%(THEME)s",
    selector: '.tinymce6_wysiwyg',
    auto_focus: 'tinymce6_wysiwyg_unique',
    document_base_url: '../../../../../../',
    body_class: 'bodyclass',
    content_css: [%(CONTENTCSS)s],
    formats: {
        bold: { inline: 'b' },
        italic: { inline: 'i' },
        underline: { inline: 'u' }
    },
    force_br_newlines: false,
    convert_newlines_to_brs: false,
    forced_root_block: 'div',
    extended_valid_elements: 'u,b,i',
    autoresize: false,
    table_use_colgroups: false,
//     table_default_styles: {
//     width: '50vw'
//   },
//   table_sizing_mode: 'fixed',

    invalid_styles: {
        '*': 'width',
        '*': 'text-align'
    },

        plugins: [
        table_toolbar: tableToolbarConfig,
            %(CUSTOMBGCOLOR)s
            editor.execCommand('mceFullScreen');
            editor.execCommand('mceVisualBlocks');
            applyClozeHighlighting(editor);
        });

            moveColumnLeft(editor);
            moveColumnRight(editor);
            moveRowUp(editor);
            moveRowDown(editor);
            removeTableStyles(editor);
            addTableMenu(editor);

            // Add custom table commands
            addCustomTableCommands(editor)

            // Add a button to invoke the custom command
            editor.ui.registry.addButton('customTableButton', {
                text: 'Custom Table Command',
                onAction: function () {
                    editor.execCommand('customTableCommand');
                }
            });

            // Check if selection includes trailing whitespace
            const selectedText = selection.getContent({ format: 'text' });
            if (/\s$/.test(selectedText)) {
                // Adjust the range to exclude trailing whitespace
                rng.setEnd(rng.endContainer, rng.endOffset - 1);
                selection.setRng(rng);
            }
        });

        // On editor close
        editor.on('getContent', function (e) {
            if (saving) {
                console.log("Closing editor")
                e.content = removeClozeHighlighting(e.content);
                // Reset the flag to ensure processing occurs only once per save
                saving = false;
            }
        });

        editor.addCommand('removeClozeHighlighting', function () {
            console.log("removeClozeHighlighting");
            let content = editor.getContent({ format: "html" });
            content = removeClozeHighlighting(content);
        });

        editor.addShortcut('ctrl+shift+r', 'Remove cloze highlighting', 'removeClozeHighlighting');
        editor.ui.registry.addButton("removeClozeHighlighting", {
            text: "RCH",
            tooltip: "removeClozeHighlighting" + "(" + "ctrl+shift+r" + ")",
            onAction: () => {
                editor.execCommand("removeClozeHighlighting");
            },
        });
    }
});
</script>

<div class="tinymce6_wysiwyg" id="tinymce6_wysiwyg_unique">CONTENTCONTENT</div>
